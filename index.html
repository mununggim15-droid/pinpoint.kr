<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>핀포인트 | 사진으로 장소 찾기</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, "Noto Sans KR", sans-serif;
            background: linear-gradient(135deg, #eef4ff, #f8fbff);
            min-height: 100vh;
            color: #222;
        }

        .container {
            width: min(900px, 92%);
            margin: 0 auto;
            padding: 60px 0;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 42px;
            margin-bottom: 12px;
            color: #2563eb;
        }

        .header p {
            color: #64748b;
            font-size: 17px;
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
        }

        .upload-box {
            border: 3px dashed #93c5fd;
            border-radius: 20px;
            min-height: 280px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.25s;
            padding: 25px;
            text-align: center;
        }

        .upload-box:hover {
            background: #eff6ff;
            border-color: #2563eb;
        }

        .upload-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .upload-box h2 {
            margin-bottom: 10px;
        }

        .upload-box p {
            color: #64748b;
            margin-top: 5px;
        }

        #imageInput {
            display: none;
        }

        .preview-container {
            display: none;
            margin-top: 25px;
        }

        .preview-container img {
            width: 100%;
            max-height: 500px;
            object-fit: contain;
            border-radius: 16px;
            background: #f1f5f9;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .analyze-btn {
            flex: 1;
            background: #2563eb;
            color: white;
        }

        .analyze-btn:hover {
            background: #1d4ed8;
        }

        .analyze-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .reset-btn {
            background: #e2e8f0;
            color: #334155;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 25px;
            color: #2563eb;
            font-weight: bold;
        }

        .spinner {
            width: 35px;
            height: 35px;
            border: 4px solid #dbeafe;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .result {
            display: none;
            margin-top: 30px;
            padding: 25px;
            border-radius: 18px;
            background: #f8fafc;
            border-left: 5px solid #2563eb;
        }

        .result h2 {
            margin-bottom: 20px;
            color: #1e40af;
        }

        .result-item {
            margin-bottom: 18px;
        }

        .result-item:last-child {
            margin-bottom: 0;
        }

        .result-item strong {
            display: block;
            margin-bottom: 6px;
            color: #475569;
        }

        .result-item span {
            font-size: 17px;
            line-height: 1.6;
        }

        .notice {
            margin-top: 20px;
            padding: 15px;
            background: #fff7ed;
            border-radius: 12px;
            color: #9a3412;
            font-size: 14px;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            .container {
                padding: 35px 0;
            }

            .header h1 {
                font-size: 32px;
            }

            .card {
                padding: 18px;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>📍 핀포인트</h1>
        <p>사진 한 장으로 촬영 장소를 추정해 보세요.</p>
    </div>

    <div class="card">

        <label class="upload-box" for="imageInput">
            <div class="upload-icon">📷</div>
            <h2>사진을 업로드하세요</h2>
            <p>AI가 건물, 간판, 도로, 지형 등을 분석합니다.</p>
            <p>JPG, PNG, WEBP 등 이미지 파일 지원</p>
        </label>

        <input
            type="file"
            id="imageInput"
            accept="image/*"
        >

        <div class="preview-container" id="previewContainer">

            <img id="previewImage" alt="업로드한 사진 미리보기">

            <div class="button-group">
                <button class="analyze-btn" id="analyzeBtn">
                    🔍 장소 분석하기
                </button>

                <button class="reset-btn" id="resetBtn">
                    다시 선택
                </button>
            </div>

        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            AI가 사진 속 장소를 분석하고 있습니다...
        </div>

        <div class="result" id="result">

            <h2>📍 AI 분석 결과</h2>

            <div class="result-item">
                <strong>추정 장소</strong>
                <span id="placeName">-</span>
            </div>

            <div class="result-item">
                <strong>지역</strong>
                <span id="region">-</span>
            </div>

            <div class="result-item">
                <strong>확신도</strong>
                <span id="confidence">-</span>
            </div>

            <div class="result-item">
                <strong>분석 내용</strong>
                <span id="description">-</span>
            </div>

        </div>

        <div class="notice">
            ⚠️ 분석 결과는 사진에 보이는 정보를 바탕으로 한 AI의 추정입니다.
            사진만으로 정확한 장소를 특정하지 못할 수도 있습니다.
        </div>

    </div>
</div>

<script>
    const imageInput = document.getElementById("imageInput");
    const previewContainer = document.getElementById("previewContainer");
    const previewImage = document.getElementById("previewImage");

    const analyzeBtn = document.getElementById("analyzeBtn");
    const resetBtn = document.getElementById("resetBtn");

    const loading = document.getElementById("loading");
    const result = document.getElementById("result");

    const placeName = document.getElementById("placeName");
    const region = document.getElementById("region");
    const confidence = document.getElementById("confidence");
    const description = document.getElementById("description");


    // 사진 선택 및 미리보기
    imageInput.addEventListener("change", function () {
        const file = this.files[0];

        if (!file) return;

        if (!file.type.startsWith("image/")) {
            alert("이미지 파일을 선택해주세요.");
            return;
        }

        const reader = new FileReader();

        reader.onload = function (event) {
            previewImage.src = event.target.result;
            previewContainer.style.display = "block";
            result.style.display = "none";
        };

        reader.readAsDataURL(file);
    });


    // 실제 AI 장소 분석
    analyzeBtn.addEventListener("click", async function () {
        const file = imageInput.files[0];

        if (!file) {
            alert("먼저 사진을 선택해주세요.");
            return;
        }

        loading.style.display = "block";
        result.style.display = "none";
        analyzeBtn.disabled = true;

        try {
            // 업로드한 사진을 Base64 형식으로 변환
            const image = await new Promise((resolve, reject) => {
                const reader = new FileReader();

                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(
                    new Error("사진을 읽는 중 오류가 발생했습니다.")
                );

                reader.readAsDataURL(file);
            });


            // Vercel의 실제 AI 분석 서버로 사진 전송
            const response = await fetch("/api/analyze-location", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    image: image
                })
            });


            const data = await response.json();


            // 서버에서 오류가 발생했을 경우
            if (!response.ok) {
                throw new Error(
                    data.error || "AI 분석 중 서버 오류가 발생했습니다."
                );
            }


            // AI가 분석한 실제 결과 표시
            placeName.textContent =
                data.place || "특정하기 어려움";

            region.textContent =
                data.region || "알 수 없음";

            confidence.textContent =
                data.confidence || "알 수 없음";

            description.textContent =
                data.description ||
                "사진에서 장소를 특정할 만한 충분한 정보를 찾지 못했습니다.";


            result.style.display = "block";


        } catch (error) {
            console.error("장소 분석 오류:", error);

            alert(
                "장소 분석 중 오류가 발생했습니다.\n\n" +
                error.message
            );

        } finally {
            loading.style.display = "none";
            analyzeBtn.disabled = false;
        }
    });


    // 다시 선택 버튼
    resetBtn.addEventListener("click", function () {
        imageInput.value = "";
        previewImage.src = "";

        previewContainer.style.display = "none";
        result.style.display = "none";

        placeName.textContent = "-";
        region.textContent = "-";
        confidence.textContent = "-";
        description.textContent = "-";
    });
</script>

</body>
</html>
